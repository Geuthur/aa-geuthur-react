name: Release

env:
  NODE_VERSION: 24 # [LTS] End of Life: 30 Apr 2028 (https://endoflife.date/nodejs)

on:
  release:
    # https://docs.github.com/en/actions/reference/events-that-trigger-workflows#release
    types: [released, prereleased]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    environment:
      name: npm-release
    permissions:
      id-token: write # npm trusted publishing (OIDC), no token needed
      contents: write # attach the tarball to the GitHub release

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      # Trusted publishing needs npm 11.5.1 or later
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check Version
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "v$package_version" != "${{ github.event.release.tag_name }}" ]; then
            echo "package.json has version $package_version but the release tag is ${{ github.event.release.tag_name }}"
            exit 1
          fi

      - name: Pack
        run: npm pack

      - name: Add Assets to Release on GitHub
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            *.tgz

      - name: Publish to npm
        run: npm publish --provenance --access public
